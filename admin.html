<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | GDI STREAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.3);
      --purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.3);
      --green: #22c55e;
      --red: #ef4444;
      --border: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background: #030712;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.1), transparent 50%);
      color: #fff;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container { max-width: 900px; margin: 0 auto; }

    h1 {
      text-align: center;
      color: var(--cyan);
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px var(--cyan-glow);
    }

    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--cyan);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1.2rem;
      transition: 0.3s;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .server-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 0.8rem;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-cyan { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan-glow); }
    .btn-purple { background: var(--purple); color: #fff; box-shadow: 0 0 15px var(--purple-glow); }
    .btn-green { background: var(--green); color: #000; width: 100%; font-size: 1.1rem; margin-top: 1rem; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-add-server { background: rgba(0, 240, 255, 0.15); color: var(--cyan); border: 1px dashed var(--cyan); margin-bottom: 1.2rem; }

    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 1rem;
    }

    .item-row {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info h4 { font-size: 1rem; color: #fff; }
    .item-info p { font-size: 0.8rem; color: #64748b; }

    .actions { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚙️ لوحة تحكم GDI STREAM</h1>

    <div class="section-card">
      <div class="section-title">🔑 إعدادات GitHub Token</div>
      <label>أدخل رمز التوكن (GitHub Personal Access Token):</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <button class="btn btn-cyan" onclick="saveToken()">تأكيد وحفظ التوكن</button>
    </div>

    <div class="section-card">
      <div class="section-title">📺 إضافة / تعديل قناة (تعدد السيرفرات)</div>
      
      <input type="hidden" id="channelEditIndex" value="-1">
      
      <label>اسم القناة:</label>
      <input type="text" id="chanName" placeholder="مثال: beIN Sports 1 HD">

      <label>رابط شعار القناة (صورة):</label>
      <input type="text" id="chanLogo" placeholder="https://domain.com/logo.png">

      <label>سيرفرات البث المباشر:</label>
      <div id="serversContainer">
        <div class="server-input-group">
          <input type="text" class="chan-server-url" placeholder="رابط البث (سيرفر 1) - m3u8">
        </div>
      </div>
      
      <button class="btn btn-add-server" onclick="addServerInput()">+ إضافة سيرفر بث آخر</button>

      <button class="btn btn-green" id="saveChanBtn" onclick="saveChannel()">➕ حفظ ونشر القناة</button>

      <div style="margin-top: 1.5rem;">
        <label>القنوات المضافة حالياً:</label>
        <div class="item-list" id="channelsList"></div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">⚽ إضافة / تعديل مباراة</div>
      
      <input type="hidden" id="matchEditIndex" value="-1">

      <label>الفريق الأول:</label>
      <input type="text" id="mTeam1" placeholder="مثال: ريال مدريد">

      <label>الفريق الثاني:</label>
      <input type="text" id="mTeam2" placeholder="مثال: برشلونة">

      <label>وقت المباراة:</label>
      <input type="text" id="mTime" placeholder="مثال: 10:00 مساءً">

      <label>رابط بث المباراة المباشر:</label>
      <input type="text" id="mUrl" placeholder="https://domain.com/match.m3u8">

      <button class="btn btn-green" id="saveMatchBtn" onclick="saveMatch()">➕ حفظ ونشر المباراة</button>

      <div style="margin-top: 1.5rem;">
        <label>المباريات المضافة حالياً:</label>
        <div class="item-list" id="matchesList"></div>
      </div>
    </div>
  </div>

  <script>
    const USER = "rrrr123kl-rgb";
    const REPO = "GDI";

    let channels = [];
    let matches = [];

    document.addEventListener("DOMContentLoaded", () => {
      const savedToken = localStorage.getItem("gdi_github_token");
      if(savedToken) document.getElementById("ghToken").value = savedToken;
      loadData();
    });

    function saveToken() {
      const token = document.getElementById("ghToken").value.trim();
      if(!token) return alert("يرجى إدخال التوكن!");
      localStorage.setItem("gdi_github_token", token);
      alert("تم حفظ التوكن بنجاح!");
    }

    function getToken() {
      return localStorage.getItem("gdi_github_token");
    }

    // إضافة حقل سيرفر جديد
    function addServerInput(url = "") {
      const container = document.getElementById("serversContainer");
      const count = container.children.length + 1;
      const div = document.createElement("div");
      div.className = "server-input-group";
      div.innerHTML = `
        <input type="text" class="chan-server-url" value="${url}" placeholder="رابط البث (سيرفر ${count}) - m3u8">
        ${count > 1 ? `<button class="btn btn-red" onclick="this.parentElement.remove()">✕</button>` : ''}
      `;
      container.appendChild(div);
    }

    async function loadData() {
      try {
        const cRes = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/channels.json?t=${Date.now()}`);
        if(cRes.ok) channels = await cRes.json();

        const mRes = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/matches.json?t=${Date.now()}`);
        if(mRes.ok) matches = await mRes.json();

        renderChannelsList();
        renderMatchesList();
      } catch(e) { console.error(e); }
    }

    function renderChannelsList() {
      const list = document.getElementById("channelsList");
      list.innerHTML = channels.map((c, i) => `
        <div class="item-row">
          <div class="item-info">
            <h4>${c.name}</h4>
            <p>عدد السيرفرات: ${Array.isArray(c.servers) ? c.servers.length : (c.url ? 1 : 0)}</p>
          </div>
          <div class="actions">
            <button class="btn btn-purple" onclick="editChannel(${i})">تعديل</button>
            <button class="btn btn-red" onclick="deleteChannel(${i})">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function renderMatchesList() {
      const list = document.getElementById("matchesList");
      list.innerHTML = matches.map((m, i) => `
        <div class="item-row">
          <div class="item-info">
            <h4>${m.team1} 🆚 ${m.team2}</h4>
            <p>⏰ ${m.time}</p>
          </div>
          <div class="actions">
            <button class="btn btn-purple" onclick="editMatch(${i})">تعديل</button>
            <button class="btn btn-red" onclick="deleteMatch(${i})">حذف</button>
          </div>
        </div>
      `).join('');
    }

    // تعديل القناة
    function editChannel(index) {
      const c = channels[index];
      document.getElementById("chanName").value = c.name;
      document.getElementById("chanLogo").value = c.logo || '';
      document.getElementById("channelEditIndex").value = index;

      const container = document.getElementById("serversContainer");
      container.innerHTML = '';

      const servers = c.servers || (c.url ? [c.url] : []);
      if(servers.length === 0) {
        addServerInput();
      } else {
        servers.forEach(s => addServerInput(s));
      }

      document.getElementById("saveChanBtn").innerText = "🔄 التحديث والحفظ";
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    async function saveChannel() {
      const token = getToken();
      if(!token) return alert("يرجى حفظ GitHub Token أولاً!");

      const name = document.getElementById("chanName").value.trim();
      const logo = document.getElementById("chanLogo").value.trim();
      const serverInputs = document.querySelectorAll(".chan-server-url");
      const servers = Array.from(serverInputs).map(i => i.value.trim()).filter(val => val !== "");
      const editIdx = parseInt(document.getElementById("channelEditIndex").value);

      if(!name || servers.length === 0) return alert("يرجى كتابة اسم القناة وإضافة سيرفر واحد على الأقل!");

      const channelObj = { name, logo, servers, url: servers[0] };

      if(editIdx >= 0) {
        channels[editIdx] = channelObj;
      } else {
        channels.push(channelObj);
      }

      await pushToGithub("channels.json", channels, "تحديث القنوات");
      
      // إعادة التعيين
      document.getElementById("chanName").value = '';
      document.getElementById("chanLogo").value = '';
      document.getElementById("serversContainer").innerHTML = '<div class="server-input-group"><input type="text" class="chan-server-url" placeholder="رابط البث (سيرفر 1) - m3u8"></div>';
      document.getElementById("channelEditIndex").value = "-1";
      document.getElementById("saveChanBtn").innerText = "➕ حفظ ونشر القناة";

      renderChannelsList();
    }

    async function deleteChannel(index) {
      if(!confirm("هل أنت تأكد من حذف هذه القناة؟")) return;
      channels.splice(index, 1);
      await pushToGithub("channels.json", channels, "حذف قناة");
      renderChannelsList();
    }

    // تعديل المباراة
    function editMatch(index) {
      const m = matches[index];
      document.getElementById("mTeam1").value = m.team1;
      document.getElementById("mTeam2").value = m.team2;
      document.getElementById("mTime").value = m.time;
      document.getElementById("mUrl").value = m.url || '';
      document.getElementById("matchEditIndex").value = index;

      document.getElementById("saveMatchBtn").innerText = "🔄 التحديث والحفظ";
      window.scrollTo({ top: 700, behavior: 'smooth' });
    }

    async function saveMatch() {
      const token = getToken();
      if(!token) return alert("يرجى حفظ GitHub Token أولاً!");

      const team1 = document.getElementById("mTeam1").value.trim();
      const team2 = document.getElementById("mTeam2").value.trim();
      const time = document.getElementById("mTime").value.trim();
      const url = document.getElementById("mUrl").value.trim();
      const editIdx = parseInt(document.getElementById("matchEditIndex").value);

      if(!team1 || !team2 || !time) return alert("يرجى ملء جميع بيانات المباراة!");

      const matchObj = { team1, team2, time, url };

      if(editIdx >= 0) {
        matches[editIdx] = matchObj;
      } else {
        matches.push(matchObj);
      }

      await pushToGithub("matches.json", matches, "تحديث المباريات");

      document.getElementById("mTeam1").value = '';
      document.getElementById("mTeam2").value = '';
      document.getElementById("mTime").value = '';
      document.getElementById("mUrl").value = '';
      document.getElementById("matchEditIndex").value = "-1";
      document.getElementById("saveMatchBtn").innerText = "➕ حفظ ونشر المباراة";

      renderMatchesList();
    }

    async function deleteMatch(index) {
      if(!confirm("هل أنت تأكد من حذف هذه المباراة؟")) return;
      matches.splice(index, 1);
      await pushToGithub("matches.json", matches, "حذف مباراة");
      renderMatchesList();
    }

    // الدالة الرئيسية للتحديث المباشر على GitHub
    async function pushToGithub(filename, data, commitMessage) {
      const token = getToken();
      const path = filename;
      const apiUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

      try {
        let sha = "";
        const getFile = await fetch(apiUrl, {
          headers: { Authorization: `token ${token}` }
        });

        if (getFile.ok) {
          const fileData = await getFile.json();
          sha = fileData.sha;
        }

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

        const res = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: commitMessage,
            content: contentBase64,
            sha: sha ? sha : undefined
          })
        });

        if (res.ok) {
          alert("✅ تم الحفظ والتحديث بنجاح!");
        } else {
          const err = await res.json();
          alert("❌ حدث خطأ أثناء الحفظ: " + (err.message || "تأكد من صحة التوكن والصلاحيات"));
        }
      } catch (e) {
        alert("❌ حدث خطأ في الاتصال بالسيرفر!");
      }
    }
  </script>
</body>
</html>
