<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDI | لوحة التحكم المحترفة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #030712;
      --card: #0f172a;
      --cyan: #00f0ff;
      --purple: #a855f7;
      --red: #ef4444;
      --green: #22c55e;
      --border: rgba(0, 240, 255, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; padding: 2rem 1rem; }
    
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    h1 { text-align: center; color: var(--cyan); font-weight: 900; letter-spacing: 1px; margin-bottom: 1rem; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card h2 { color: var(--purple); margin-bottom: 1rem; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    label { color: #94a3b8; font-size: 0.9rem; }
    input, select { width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; transition: 0.3s; font-size: 0.95rem; }
    input[type="file"] { padding: 8px; cursor: pointer; }
    input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-cyan { background: var(--cyan); color: #000; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-red { background: var(--red); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; }
    .btn-edit { background: var(--purple); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; width: auto; margin-left: 5px; }

    .player-box { background: #000; border: 1px solid var(--cyan); border-radius: 12px; overflow: hidden; margin-top: 10px; }
    video { width: 100%; height: auto; display: block; max-height: 350px; }

    .list-item { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
    .list-item img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; margin-left: 10px; border: 1px solid var(--border); }
    .info { display: flex; align-items: center; }

    #status { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 30px; background: var(--cyan); color: #000; font-weight: bold; display: none; box-shadow: 0 0 20px rgba(0,240,255,0.5); z-index: 1000; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚙️ لوحة تحكم GDI</h1>

    <div class="card">
      <h2>🔑 إعدادات GitHub Token</h2>
      <div class="form-group">
        <label>أدخل رمز التوكن (GitHub Token):</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <button class="btn btn-cyan" onclick="saveToken()">تأكيد وحفظ التوكن</button>
    </div>

    <div class="card">
      <h2>🎬 مشغل معاينة البث</h2>
      <div class="form-group">
        <label>رابط التجربة (m3u8):</label>
        <input type="text" id="testUrl" placeholder="https://domain.com/live.m3u8">
      </div>
      <button class="btn btn-purple" onclick="testStream()">تشغيل المعاينة</button>
      <div class="player-box" style="margin-top: 15px;">
        <video id="previewPlayer" controls></video>
      </div>
    </div>

    <div class="card">
      <h2>📺 إضافة / تعديل القنوات (رابط أو ملف M3U)</h2>
      <input type="hidden" id="channelIndex" value="-1">
      
      <div class="form-group">
        <label>اسم القناة:</label>
        <input type="text" id="cName" placeholder="مثال: beIN Sports 1">
      </div>
      
      <div class="form-group">
        <label>صورة/شعارات القناة (رابط الصورة):</label>
        <input type="text" id="cLogo" placeholder="https://domain.com/logo.png">
      </div>
      
      <div class="form-group">
        <label>📁 اختيار ملف M3U من جهازك (اختياري):</label>
        <input type="file" id="m3uFileInput" accept=".m3u,.m3u8" onchange="handleM3UFile(event)">
        <span style="font-size:0.75rem; color:var(--cyan);">عند اختيار ملف m3u سيتم استخراج الرابط أو رفعه تلقائياً.</span>
      </div>
      
      <div class="form-group">
        <label>رابط البث أو الملف (Stream URL / M3U):</label>
        <input type="text" id="cUrl" placeholder="https://domain.com/stream.m3u8">
      </div>
      
      <button class="btn btn-green" id="btnSaveChannel" onclick="addOrUpdateChannel()">➕ حفظ ونشر القناة</button>

      <h3 style="margin-top: 1.5rem; color: var(--cyan); font-size: 1rem;">القنوات المضافة حالياً:</h3>
      <div id="channelsList"></div>
    </div>

    <div class="card">
      <h2>⚽ جدول المباريات</h2>
      <input type="hidden" id="matchIndex" value="-1">
      
      <div class="form-group">
        <label>الفريق الأول:</label>
        <input type="text" id="mTeam1" placeholder="مثال: ريال مدريد">
      </div>
      
      <div class="form-group">
        <label>الفريق الثاني:</label>
        <input type="text" id="mTeam2" placeholder="مثال: برشلونة">
      </div>
      
      <div class="form-group">
        <label>الوقت:</label>
        <input type="text" id="mTime" placeholder="مثال: 10:00 مساءً">
      </div>
      
      <div class="form-group">
        <label>رابط القناة الناقلة للمباراة (اختياري):</label>
        <input type="text" id="mStream" placeholder="رابط البث المباشر">
      </div>
      
      <button class="btn btn-green" id="btnSaveMatch" onclick="addOrUpdateMatch()">➕ حفظ ونشر المباراة</button>

      <h3 style="margin-top: 1.5rem; color: var(--cyan); font-size: 1rem;">المباريات المضافة:</h3>
      <div id="matchesList"></div>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const USER = "rrrr123kl-rgb";
    const REPO = "GDI";
    let channelsData = [];
    let matchesData = [];

    document.addEventListener("DOMContentLoaded", () => {
      const savedToken = localStorage.getItem("gdi_gh_token");
      if(savedToken) {
        document.getElementById("ghToken").value = savedToken;
        fetchAllData();
      }
    });

    function saveToken() {
      const t = document.getElementById("ghToken").value.trim();
      if(!t) return alert("يرجى إدخال التوكن!");
      localStorage.setItem("gdi_gh_token", t);
      showStatus("تم حفظ التوكن، جاري تحميل البيانات...");
      fetchAllData();
    }

    function showStatus(msg) {
      const s = document.getElementById("status");
      s.innerText = msg;
      s.style.display = "block";
      setTimeout(() => s.style.display = "none", 3000);
    }

    // معالجة قراءة ملف M3U من الهاتف أو الكمبيوتر
    function handleM3UFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        // البحث عن أوّل رابط بث داخل ملف m3u
        const lines = text.split('\n');
        let streamUrl = "";
        for (let line of lines) {
          line = line.trim();
          if (line && !line.startsWith('#')) {
            streamUrl = line;
            break;
          }
        }

        if (streamUrl) {
          document.getElementById("cUrl").value = streamUrl;
          showStatus("✅ تم قراءة واستخراج رابط البث من ملف M3U بنجاح!");
        } else {
          alert("تعذر قراءة رابط مباشر داخل ملف M3U.");
        }
      };
      reader.readAsText(file);
    }

    function testStream() {
      const url = document.getElementById("testUrl").value.trim();
      if(!url) return alert("ضع رابطاً لتجربته أولاً!");
      const video = document.getElementById("previewPlayer");

      if (Hls.isSupported() && url.includes(".m3u8")) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else {
        video.src = url;
        video.play();
      }
    }

    async function fetchAllData() {
      try {
        const cRes = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/channels.json?t=${Date.now()}`);
        if(cRes.ok) channelsData = await cRes.json();
        renderChannels();

        const mRes = await fetch(`https://raw.githubusercontent.com/${USER}/${REPO}/main/matches.json?t=${Date.now()}`);
        if(mRes.ok) matchesData = await mRes.json();
        renderMatches();
      } catch(e) { console.error(e); }
    }

    function renderChannels() {
      const div = document.getElementById("channelsList");
      div.innerHTML = channelsData.map((c, i) => `
        <div class="list-item">
          <div class="info">
            <img src="${c.logo || 'https://via.placeholder.com/45'}" alt="">
            <div style="margin-right: 10px;">
              <strong>${c.name}</strong>
            </div>
          </div>
          <div>
            <button class="btn-edit" onclick="editChannel(${i})">تعديل</button>
            <button class="btn-red" onclick="deleteChannel(${i})">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function renderMatches() {
      const div = document.getElementById("matchesList");
      div.innerHTML = matchesData.map((m, i) => `
        <div class="list-item">
          <div>
            <strong>${m.team1} 🆚 ${m.team2}</strong>
            <div style="font-size:0.75rem; color:#94a3b8;">⏰ ${m.time}</div>
          </div>
          <div>
            <button class="btn-edit" onclick="editMatch(${i})">تعديل</button>
            <button class="btn-red" onclick="deleteMatch(${i})">حذف</button>
          </div>
        </div>
      `).join('');
    }

    async function addOrUpdateChannel() {
      const name = document.getElementById("cName").value.trim();
      const logo = document.getElementById("cLogo").value.trim();
      const url = document.getElementById("cUrl").value.trim();
      const idx = parseInt(document.getElementById("channelIndex").value);

      if(!name || !url) return alert("يرجى ملء اسم القناة والرابط أو اختيار ملف M3U!");

      const item = { name, logo, type: 'm3u', url };
      if(idx === -1) channelsData.push(item);
      else channelsData[idx] = item;

      await syncToGithub("channels.json", channelsData);
      resetChannelForm();
    }

    function editChannel(i) {
      const c = channelsData[i];
      document.getElementById("cName").value = c.name;
      document.getElementById("cLogo").value = c.logo || '';
      document.getElementById("cUrl").value = c.url;
      document.getElementById("channelIndex").value = i;
      document.getElementById("btnSaveChannel").innerText = "✏️ تحديث القناة";
    }

    async function deleteChannel(i) {
      if(!confirm("تأكيد حذف القناة؟")) return;
      channelsData.splice(i, 1);
      await syncToGithub("channels.json", channelsData);
    }

    function resetChannelForm() {
      document.getElementById("cName").value = '';
      document.getElementById("cLogo").value = '';
      document.getElementById("cUrl").value = '';
      document.getElementById("m3uFileInput").value = '';
      document.getElementById("channelIndex").value = -1;
      document.getElementById("btnSaveChannel").innerText = "➕ حفظ ونشر القناة";
    }

    async function addOrUpdateMatch() {
      const team1 = document.getElementById("mTeam1").value.trim();
      const team2 = document.getElementById("mTeam2").value.trim();
      const time = document.getElementById("mTime").value.trim();
      const url = document.getElementById("mStream").value.trim();
      const idx = parseInt(document.getElementById("matchIndex").value);

      if(!team1 || !team2 || !time) return alert("يرجى ملء تفاصيل المباراة!");

      const item = { team1, team2, time, url };
      if(idx === -1) matchesData.push(item);
      else matchesData[idx] = item;

      await syncToGithub("matches.json", matchesData);
      resetMatchForm();
    }

    function editMatch(i) {
      const m = matchesData[i];
      document.getElementById("mTeam1").value = m.team1;
      document.getElementById("mTeam2").value = m.team2;
      document.getElementById("mTime").value = m.time;
      document.getElementById("mStream").value = m.url || '';
      document.getElementById("matchIndex").value = i;
      document.getElementById("btnSaveMatch").innerText = "✏️ تحديث المباراة";
    }

    async function deleteMatch(i) {
      if(!confirm("تأكيد حذف المباراة؟")) return;
      matchesData.splice(i, 1);
      await syncToGithub("matches.json", matchesData);
    }

    function resetMatchForm() {
      document.getElementById("mTeam1").value = '';
      document.getElementById("mTeam2").value = '';
      document.getElementById("mTime").value = '';
      document.getElementById("mStream").value = '';
      document.getElementById("matchIndex").value = -1;
      document.getElementById("btnSaveMatch").innerText = "➕ حفظ ونشر المباراة";
    }

    async function syncToGithub(filename, data) {
      const token = localStorage.getItem("gdi_gh_token");
      if(!token) return alert("ضع التوكن الخاص بك أولاً!");

      showStatus("جاري المزامنة والحفظ...");

      try {
        const fileUrl = `https://api.github.com/repos/${USER}/${REPO}/contents/${filename}`;
        let sha = "";

        const getRes = await fetch(fileUrl, { headers: { "Authorization": `token ${token}` } });
        if(getRes.ok) {
          const json = await getRes.json();
          sha = json.sha;
        }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
        
        const putRes = await fetch(fileUrl, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Update ${filename}`,
            content: content,
            sha: sha ? sha : undefined
          })
        });

        if(putRes.ok) {
          showStatus("✅ تم الحفظ بنجاح!");
          fetchAllData();
        } else {
          alert("حدث خطأ، تأكد من التوكن.");
        }
      } catch(e) {
        console.error(e);
        alert("فشل الاتصال بـ GitHub.");
      }
    }
  </script>
</body>
</html>
